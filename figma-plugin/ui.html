<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mokido</title>
  <style>
    /* mk-tokens:begin (generated by planning/tools/ui_tokens.py from Figma "Mokido"; do not edit by hand) */
    :root {
      --mk-font-sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mk-font-mono: ui-monospace, "SF Mono", "Roboto Mono", Consolas, monospace;
      --mk-text-title-13-semibold: 600 13px/18px var(--mk-font-sans);
      --mk-text-body-12: 400 12px/16px var(--mk-font-sans);
      --mk-text-body-12-medium: 500 12px/16px var(--mk-font-sans);
      --mk-text-body-11: 400 11px/16px var(--mk-font-sans);
      --mk-text-label-11-medium: 500 11px/14px var(--mk-font-sans);
      --mk-text-label-11-medium-ls: 0.002em;
      --mk-text-mono-11: 400 11px/16px var(--mk-font-mono);
      --mk-text-display-22-semibold: 600 22px/28px var(--mk-font-sans);
      --mk-text-display-22-semibold-ls: -0.015em;
      --mk-text-title-16-semibold: 600 16px/22px var(--mk-font-sans);
      --mk-text-title-16-semibold-ls: -0.015em;
      --mk-space-0: 0px;
      --mk-space-2: 2px;
      --mk-space-4: 4px;
      --mk-space-6: 6px;
      --mk-space-8: 8px;
      --mk-space-12: 12px;
      --mk-space-16: 16px;
      --mk-space-20: 20px;
      --mk-space-24: 24px;
      --mk-radius-sm: 4px;
      --mk-radius-md: 8px;
      --mk-radius-lg: 12px;
      --mk-radius-pill: 999px;
      --mk-bg: #ffffff;
      --mk-bg-subtle: #f3f0ed;
      --mk-surface: #faf8f6;
      --mk-surface-hover: #f3f0ed;
      --mk-border: #e7e2dd;
      --mk-border-strong: #d3ccc5;
      --mk-text: #1d1a18;
      --mk-text-muted: #635c56;
      --mk-text-disabled: #aba39b;
      --mk-accent: #ff957a;
      --mk-accent-hover: #f7714f;
      --mk-accent-text: #151311;
      --mk-accent-subtle: #ffe6de;
      --mk-accent-fg: #b8411f;
      --mk-status-ok: #1b6639;
      --mk-status-ok-bg: #ddf5e6;
      --mk-status-busy: #1f4fb0;
      --mk-status-busy-bg: #dfebff;
      --mk-status-warn: #8a5b00;
      --mk-status-warn-bg: #fff1cc;
      --mk-status-error: #a12a20;
      --mk-status-error-bg: #ffe1de;
      --mk-status-idle: #847c75;
      --mk-focus: #3b7bf6;
      --mk-shadow: #1513111a;
      --mk-moki-body: #ff957a;
      --mk-moki-cheek: #f26972a1;
      --mk-moki-ink: #3b2522;
      --mk-moki-shine: #ffffff;
      --mk-moki-shadow: #28140f0f;
      --mk-moki-dim: 0.45;
    }
    html.figma-dark:not([data-theme="light"]), html[data-theme="dark"] {
      --mk-bg: #1d1a18;
      --mk-bg-subtle: #151311;
      --mk-surface: #252220;
      --mk-surface-hover: #2e2a27;
      --mk-border: #45403c;
      --mk-border-strong: #635c56;
      --mk-text: #faf8f6;
      --mk-text-muted: #aba39b;
      --mk-text-disabled: #635c56;
      --mk-accent: #ff957a;
      --mk-accent-hover: #ffae97;
      --mk-accent-text: #151311;
      --mk-accent-subtle: #5c2210;
      --mk-accent-fg: #ffae97;
      --mk-status-ok: #7fd4a0;
      --mk-status-ok-bg: #12341f;
      --mk-status-busy: #8db4ff;
      --mk-status-busy-bg: #13254a;
      --mk-status-warn: #ffd46b;
      --mk-status-warn-bg: #3d2c05;
      --mk-status-error: #ff9b90;
      --mk-status-error-bg: #45140f;
      --mk-status-idle: #847c75;
      --mk-focus: #8db4ff;
      --mk-shadow: #00000073;
      --mk-moki-body: #ff957a;
      --mk-moki-cheek: #f26972a1;
      --mk-moki-ink: #3b2522;
      --mk-moki-shine: #ffffff;
      --mk-moki-shadow: #0000004d;
      --mk-moki-dim: 0.7;
    }
    /* mk-tokens:end */

    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: var(--mk-bg); color: var(--mk-text);
      font: var(--mk-text-body-12);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    button { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--mk-focus); outline-offset: 1px; }
    [hidden] { display: none !important; }
    svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

    /* ---------- Window (full view) ---------- */
    .Window { position: absolute; inset: 0; display: flex; flex-direction: column; }
    .Header { height: 44px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px; }
    .Context { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
    .ContextText {
      min-width: 0; white-space: nowrap; overflow: hidden;
      font: var(--mk-text-label-11-medium); letter-spacing: var(--mk-text-label-11-medium-ls); color: var(--mk-text-muted);
    }
    .ChromeButtons { flex: none; display: flex; gap: 4px; }
    .IconButton {
      width: 28px; height: 28px; flex: none; border-radius: var(--mk-radius-md);
      display: inline-flex; align-items: center; justify-content: center; color: var(--mk-text);
    }
    .IconButton:hover { background: var(--mk-surface-hover); }
    .VersionPill {
      flex: none; display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px;
      border-radius: var(--mk-radius-pill); background: var(--mk-status-warn-bg); color: var(--mk-text);
      font: var(--mk-text-body-12); line-height: 15px; white-space: nowrap;
    }
    .VersionPill.open { box-shadow: 0 0 0 1px var(--mk-status-warn); }
    .VersionPill .Dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mk-status-warn); }

    .Stage { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 0 16px 8px; }
    .Row { flex: none; display: flex; align-items: flex-end; gap: 10px; }

    /* MokiSlot: m = slot width; art = m - m/16, top margin m/8 (360 -> 128/120/16, kit Mokido/MokiSlot) */
    .MokiSlot {
      --m: clamp(104px, calc(128px + 0.6 * (100vw - 360px)), 200px);
      position: relative; flex: none; width: var(--m);
      padding: calc(var(--m) * 0.125) calc(var(--m) * 0.0625) 0 0;
    }
    .MokiArt { display: block; width: 100%; aspect-ratio: 368 / 232; overflow: visible; }
    .MokiSlot.dim .MokiArt { opacity: var(--mk-moki-dim); }
    .Zzz {
      position: absolute; left: calc(var(--m) * 0.9375 * 0.62); top: 0;
      font-size: calc(var(--m) * 0.094); line-height: 1.25; color: var(--mk-text-muted);
    }
    .ErrorDot {
      position: absolute; width: calc(var(--m) * 0.078); height: calc(var(--m) * 0.078); border-radius: 50%;
      left: calc(var(--m) * 0.9375 * 0.8); top: calc(var(--m) * 0.125 + var(--m) * 0.9375 * 0.6304 * 0.22);
      background: var(--mk-status-error); box-shadow: 0 0 0 2px var(--mk-bg);
    }

    .SpeechBubble {
      position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding: 12px;
      border-radius: var(--mk-radius-lg); background: var(--mk-surface); border: 1px solid var(--mk-border);
    }
    /* Tail: 14x14 square turned 45deg on the bubble's left edge, pointing at Moki's face. */
    .Tail {
      position: absolute; left: -8px; bottom: 18px; width: 14px; height: 14px;
      background: var(--mk-surface); border-left: 1px solid var(--mk-border); border-bottom: 1px solid var(--mk-border);
      transform: rotate(45deg);
    }
    .Title, .Body {
      display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere;
    }
    .Title {
      font: var(--mk-text-title-16-semibold); letter-spacing: var(--mk-text-title-16-semibold-ls); color: var(--mk-text);
      -webkit-line-clamp: var(--title-lines, 2);
    }
    .Body { font: var(--mk-text-body-12); color: var(--mk-text-muted); -webkit-line-clamp: var(--body-lines, 3); }
    .Extra, .Code { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .Extra { font: var(--mk-text-body-11); color: var(--mk-text-muted); }
    .Code { font: var(--mk-text-mono-11); color: var(--mk-status-error); user-select: text; }
    .ProgressBar { flex: none; height: 4px; margin-top: 4px; border-radius: var(--mk-radius-pill); background: var(--mk-bg-subtle); overflow: hidden; }
    .ProgressBar .Bar { height: 100%; width: 0; border-radius: var(--mk-radius-pill); background: var(--mk-accent); transition: width 0.3s; }
    .ProgressBar.indeterminate .Bar { width: 30%; transition: none; animation: mk-indet 1.4s ease-in-out infinite; }
    @keyframes mk-indet { from { transform: translateX(-100%); } to { transform: translateX(340%); } }

    .ButtonsRow { flex: none; display: flex; gap: 8px; }
    .Button {
      height: 24px; padding: 0 8px; gap: 4px; flex: none; border-radius: var(--mk-radius-md);
      display: inline-flex; align-items: center; white-space: nowrap;
      font: var(--mk-text-body-12-medium); color: var(--mk-text);
    }
    .Button svg.i { width: 14px; height: 14px; }
    .Button.primary { background: var(--mk-accent); color: var(--mk-accent-text); }
    .Button.primary:hover { background: var(--mk-accent-hover); }
    .Button.secondary { background: var(--mk-surface); box-shadow: inset 0 0 0 1px var(--mk-border); }
    .Button.secondary:hover, .Button.ghost:hover { background: var(--mk-surface-hover); }
    .Button.icon-only { width: 24px; padding: 0; justify-content: center; }
    .Button.icon-only .Label { display: none; }

    .Footer {
      height: 28px; flex: none; display: flex; align-items: center; padding: 0 24px 0 16px;
      background: var(--mk-bg-subtle); border-top: 1px solid var(--mk-border);
    }
    .Trace { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: var(--mk-text-body-11); color: var(--mk-text-muted); }
    .Trace.jump { cursor: pointer; }
    .Trace.jump:hover { color: var(--mk-text); }

    .ResizeGrip { position: fixed; right: 4px; bottom: 4px; width: 12px; height: 12px; z-index: 10; color: var(--mk-text-muted); cursor: nwse-resize; touch-action: none; }
    .ResizeGrip svg { display: block; width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.25; stroke-linecap: round; }

    /* ---------- Settings (over the same window) ---------- */
    .Settings { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--mk-bg); }
    .SettingsHeader { height: 44px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 8px; }
    .SettingsTitle { flex: 1; font: var(--mk-text-title-13-semibold); }
    .SettingsBody { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 20px; user-select: text; }
    .Group { display: flex; flex-direction: column; gap: 12px; }
    .GroupTitle { font: var(--mk-text-label-11-medium); letter-spacing: var(--mk-text-label-11-medium-ls); color: var(--mk-text-muted); text-transform: uppercase; }
    .Field { display: flex; flex-direction: column; gap: 4px; }
    .FieldLabel { font: var(--mk-text-label-11-medium); letter-spacing: var(--mk-text-label-11-medium-ls); color: var(--mk-text-muted); }
    .TextInput {
      width: 100%; height: 28px; padding: 0 8px; border-radius: var(--mk-radius-md);
      border: 1px solid var(--mk-border); background: var(--mk-bg); color: var(--mk-text); font: var(--mk-text-body-12);
    }
    .TextInput:focus { outline: none; border-color: var(--mk-focus); }
    .TextInput.error { border-color: var(--mk-status-error); }
    .Helper { font: var(--mk-text-body-11); color: var(--mk-status-error); }
    .Meta { font: var(--mk-text-body-12); color: var(--mk-text-muted); }
    .Meta b { font-weight: 500; color: var(--mk-text); }
    .Meta .warn { color: var(--mk-status-warn); }
    .MetaRow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .Meta.err { color: var(--mk-status-error); }
    .SettingRow { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 24px; font: var(--mk-text-body-12); }
    .SettingRow .Segmented { flex: none; }
    .SettingText { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .Advanced { border-top: 1px solid var(--mk-border); padding-top: 12px; }
    .Advanced summary { list-style: none; display: flex; align-items: center; justify-content: space-between; cursor: pointer;
      font: var(--mk-text-label-11-medium); letter-spacing: var(--mk-text-label-11-medium-ls); color: var(--mk-text-muted); text-transform: uppercase; }
    .Advanced summary::-webkit-details-marker { display: none; }
    .Advanced summary:hover { color: var(--mk-text); }
    .Advanced .Chevron { display: flex; }
    .Advanced .Chevron svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; transition: transform 120ms; }
    .Advanced[open] .Chevron svg { transform: rotate(180deg); }
    .Advanced > .Field { margin-top: 12px; }
    .SettingName { font: var(--mk-text-body-12-medium); color: var(--mk-text); }
    .SettingHint { font: var(--mk-text-body-11); color: var(--mk-text-muted); }
    .Group.behavior { gap: 14px; }
    .InputRow { display: flex; align-items: center; gap: 8px; }
    .InputRow .TextInput { flex: 1; min-width: 0; }
    .InputRow .Button { height: 28px; }
    .VersionCard {
      display: flex; flex-direction: column; gap: 10px; padding: 12px;
      border-radius: var(--mk-radius-lg); background: var(--mk-surface); border: 1px solid var(--mk-border);
    }
    .VersionCard.mismatch { border-color: var(--mk-status-warn); }
    .VerTop { display: flex; align-items: flex-end; gap: 20px; }
    .VerCol { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .VerLabel { font: var(--mk-text-label-11-medium); letter-spacing: var(--mk-text-label-11-medium-ls); color: var(--mk-text-muted); }
    .VerNum { font: var(--mk-text-title-16-semibold); font-family: var(--mk-font-mono); letter-spacing: 0; font-variant-numeric: tabular-nums; color: var(--mk-text); }
    .VerNum.warn { color: var(--mk-status-warn); }
    .VerNum.none { color: var(--mk-text-disabled); }
    .Chip {
      margin-left: auto; flex: none; padding: 3px 8px; border-radius: var(--mk-radius-pill); white-space: nowrap;
      font: var(--mk-text-body-11); font-weight: 500; background: var(--mk-bg-subtle); color: var(--mk-text-muted);
    }
    .Chip.ok { background: var(--mk-status-ok-bg); color: var(--mk-status-ok); }
    .Chip.warn { background: var(--mk-status-warn-bg); color: var(--mk-status-warn); }
    .VerFix { display: flex; flex-direction: column; gap: 6px; }
    .CmdRow { display: flex; align-items: center; gap: 8px; }
    .CmdBox {
      flex: 1; min-width: 0; height: 28px; padding: 0 8px; display: flex; align-items: center; white-space: nowrap; overflow: hidden;
      border-radius: var(--mk-radius-md); background: var(--mk-bg-subtle); font: var(--mk-text-mono-11); color: var(--mk-text); user-select: text;
    }
    .CmdRow .Button { height: 28px; }
    .Cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .Cards button {
      min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 8px 8px;
      border-radius: var(--mk-radius-md); background: var(--mk-bg); box-shadow: inset 0 0 0 1px var(--mk-border);
      font: var(--mk-text-body-12-medium); color: var(--mk-text-muted);
    }
    .Cards button:hover { background: var(--mk-surface-hover); }
    .Cards button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--mk-accent); color: var(--mk-text); background: var(--mk-surface); }
    .Thumb { height: 36px; display: flex; align-items: center; justify-content: center; }
    .ThumbSquare { width: 40px; height: 30px; border-radius: var(--mk-radius-md); background: var(--mk-bg-subtle); border: 1px solid var(--mk-border-strong); display: flex; align-items: center; justify-content: center; }
    .ThumbSquare::after { content: ""; width: 16px; height: 16px; border-radius: 50%; background: var(--mk-accent); }
    .ThumbBar { width: 72px; height: 20px; border-radius: var(--mk-radius-md); background: var(--mk-bg-subtle); border: 1px solid var(--mk-border-strong); display: flex; align-items: center; gap: 4px; padding: 0 3px; }
    .ThumbBar::before { content: ""; width: 12px; height: 12px; flex: none; border-radius: 50%; background: var(--mk-accent); }
    .ThumbBar::after { content: ""; flex: 1; height: 4px; border-radius: var(--mk-radius-pill); background: var(--mk-border-strong); }
    .Segmented { display: flex; padding: 2px; gap: 2px; border-radius: var(--mk-radius-md); background: var(--mk-bg-subtle); }
    .Segmented button {
      flex: 1 1 auto; min-width: 0; height: 24px; padding: 0 8px; border-radius: var(--mk-radius-sm);
      font: var(--mk-text-body-12-medium); color: var(--mk-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .Segmented button[aria-pressed="true"] { background: var(--mk-bg); color: var(--mk-text); box-shadow: 0 1px 2px var(--mk-shadow); }
    .Toggle { flex: none; width: 32px; height: 18px; padding: 2px; border-radius: var(--mk-radius-pill); background: var(--mk-border-strong); }
    .Toggle::after { content: ""; display: block; width: 14px; height: 14px; border-radius: 50%; background: var(--mk-surface); transition: transform 0.15s; }
    .Toggle[aria-checked="true"] { background: var(--mk-accent); }
    .Toggle[aria-checked="true"]::after { transform: translateX(14px); }

    /* ---------- Compact: Square (kit Mokido/Compact Square) and Bar (Mokido/Compact Bar) ---------- */
    .CompactSquare { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
    /* Moki fits the smaller side: width, or height minus label (and Resume when paused). MokiSlot height is ~0.77 m. */
    .CompactSquare .MokiSlot { --m: min(64vw, calc((100vh - 44px) * 1.3)); }
    .CompactSquare:has(> .Button:not([hidden])) .MokiSlot { --m: min(64vw, calc((100vh - 78px) * 1.3)); }
    /* Face (mouth x=256 in viewBox 80..448) sits at 0.448 m because of the drop and right padding: shift it to the centre. */
    .CompactSquare .MokiSlot { transform: translateX(calc(var(--m) * 0.052)); }
    .CompactSquare .Expand { position: absolute; top: 6px; right: 6px; }
    .CompactLabel { max-width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: var(--mk-text-title-13-semibold); }
    .CompactBar { position: absolute; inset: 0; display: flex; align-items: center; gap: 8px; padding: 4px 8px; }
    /* Top padding (room for Zzz) puts the body 0.052 m below the slot centre: lift it to the bar's middle. */
    .CompactBar .MokiSlot { --m: 56px; transform: translateY(calc(var(--m) * -0.052)); }
    .CompactBar .CompactLabel { flex: 1; max-width: none; font: var(--mk-text-body-12); }
    .CompactLabel.warn { color: var(--mk-status-warn); }
    .CompactLabel.err { color: var(--mk-status-error); }
    .CompactBar .IconButton svg.i, .CompactSquare .IconButton svg.i { color: var(--mk-text-muted); }

    .Toast {
      position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%); z-index: 20; pointer-events: none;
      padding: 4px 10px; border-radius: var(--mk-radius-pill); background: var(--mk-text); color: var(--mk-bg);
      font: var(--mk-text-body-12-medium); opacity: 0; transition: opacity 0.15s;
    }
    .Toast.show { opacity: 1; }
  </style>
</head>
<body>
  <section class="Window" id="view-full">
    <header class="Header">
      <div class="Context">
        <button class="VersionPill" id="pill" hidden><span class="Dot"></span><span id="pill-label"></span></button>
        <span class="ContextText" id="context"></span>
      </div>
      <div class="ChromeButtons">
        <button class="IconButton" id="btn-settings" data-icon="settings"></button>
        <button class="IconButton" id="btn-minimize" data-icon="minimize"></button>
      </div>
    </header>
    <main class="Stage" id="stage">
      <div class="Row" id="row">
        <div class="MokiSlot" id="moki-full"></div>
        <div class="SpeechBubble" id="bubble">
          <span class="Tail"></span>
          <div class="Title" id="b-title"></div>
          <div class="Body" id="b-body"></div>
          <div class="Extra" id="b-extra"></div>
          <div class="Code" id="b-code"></div>
          <div class="ProgressBar" id="b-progress"><div class="Bar"></div></div>
        </div>
      </div>
      <div class="ButtonsRow" id="buttons"></div>
    </main>
    <footer class="Footer" id="footer"><span class="Trace" id="trace"></span></footer>
  </section>

  <section class="Settings" id="view-settings" hidden>
    <header class="SettingsHeader">
      <button class="IconButton" id="btn-back" data-icon="arrow-left"></button>
      <span class="SettingsTitle" data-t="settings.title"></span>
    </header>
    <div class="SettingsBody">
      <div class="Group">
        <div class="GroupTitle" data-t="settings.versionsTitle"></div>
        <div class="VersionCard" id="ver-card">
          <div class="VerTop">
            <div class="VerCol"><span class="VerLabel" data-t="settings.plugin"></span><span class="VerNum" id="ver-plugin"></span></div>
            <div class="VerCol"><span class="VerLabel" data-t="settings.serverShort"></span><span class="VerNum" id="ver-server"></span></div>
            <span class="Chip" id="ver-chip"></span>
          </div>
          <div class="VerFix" id="ver-fix" hidden>
            <div class="CmdRow">

  <!-- Pure state logic: no DOM, no globals besides MK. tests/ui-state.test.js extracts and runs this block in Node. -->
  <script id="mk-state">
    var MK = (function () {
      var DEFAULT_LIMITS = { escalateMs: 45000, stalledAfterMs: 120000 };
      // U-17: reconnect backoff 1.5 -> 3 -> 6 -> 10 s (ceiling)
      var BACKOFF_MS = [1500, 3000, 6000, 10000];
      var WORK_STATES = ['stalled', 'long_job', 'queued', 'capturing', 'working'];

      function backoff(attempts) {
        return BACKOFF_MS[Math.min(Math.max(attempts, 1), BACKOFF_MS.length) - 1];
      }
      function hostPort(url) {
        return String(url || '').replace(/^\w+:\/\//, '').replace(/\/.*$/, '');
      }
      function validServerUrl(url) {
        return /^https?:\/\/[^\s\/:]+(:\d{1,5})?\/?$/.test(String(url || '').trim());
      }
      function majorMinor(v) {
        var m = /^(\d+)\.(\d+)/.exec(String(v || ''));
        return m ? m[1] + '.' + m[2] : null;
      }
      function versionMismatch(pluginVersion, serverVersion) {
        var a = majorMinor(pluginVersion), b = majorMinor(serverVersion);
        return !!(a && b && a !== b);
      }
      function activeList(m) {
        var list = [];
        if (m.active) m.active.forEach(function (a, id) { list.push(Object.assign({ id: id }, a)); });
        return list.sort(function (x, y) { return x.startedAt - y.startedAt; });
      }
      function limitsOf(m) {
        var l = (m.status && m.status.limits) || {};
        return {
          escalateMs: l.escalateMs > 0 ? l.escalateMs : DEFAULT_LIMITS.escalateMs,
          stalledAfterMs: l.stalledAfterMs > 0 ? l.stalledAfterMs : DEFAULT_LIMITS.stalledAfterMs
        };
      }
      function quietMs(a, now) { return now - Math.max(a.startedAt, a.lastProgressAt || 0); }

      // Which open target is this plugin? By clientId (CLIENT_ACK); an older server
      // without CLIENT_ACK falls back to a unique fileName match.
      function myTarget(m) {
        var targets = (m.status && m.status.targets) || [];
        if (m.myClientId) return targets.filter(function (t) { return t.id === m.myClientId; })[0] || null;
        var same = targets.filter(function (t) { return m.doc && t.fileName === m.doc.fileName; });
        return same.length === 1 ? same[0] : null;
      }

      // SPEC 1: first matching row wins. version_mismatch is a banner, not a state.
      function deriveState(m, now) {
        if (m.ws !== 'open') {
          if (m.attempts >= 3 && m.httpStatus === '403') return 'token_mismatch';
          if (m.attempts >= 3 && m.httpStatus !== 'ok') return 'offline';
          return 'connecting';
        }
        if (m.paused) return 'paused';
        var list = activeList(m), lim = limitsOf(m);
        if (list.length) {
          if (list.some(function (a) { return quietMs(a, now) > lim.stalledAfterMs; })) return 'stalled';
          if (list.some(function (a) { return now - a.startedAt > lim.escalateMs; })) return 'long_job';
          if (list.length > 1) return 'queued';
          return list[0].isCapture ? 'capturing' : 'working';
        }
        var targets = (m.status && m.status.targets) || [];
        var mine = myTarget(m);
        if (targets.length > 1 && mine && !mine.focused) return 'other_target';
        if (m.lastResult && m.lastResult.success === false && !m.failDismissed) return 'last_failed';
        return 'ready';
      }

      var MOOD = {
        connecting: 'looking', ready: 'calm', working: 'busy', queued: 'busy', long_job: 'busy',
        capturing: 'camera', stalled: 'sad', paused: 'calm', last_failed: 'sad', offline: 'asleep',
        token_mismatch: 'looking', other_target: 'looking'
      };

      var T = {
        en: {
          notConnected: 'Not connected',
          updateNeeded: 'Update needed',
          badge: {
            connecting: 'Connecting', ready: 'Ready', working: 'Working', capturing: 'Screenshot', queued: 'Working · +{k}',
            long_job: 'Long task · {n} s', stalled: 'Stuck · {n} s', paused: 'Paused', last_failed: 'Failed',
            offline: 'Offline', token_mismatch: 'Token mismatch', other_target: 'Other file'
          },
          title: {
            token_mismatch: "Can't connect: token mismatch", offline: "Mokido server isn't running", connecting: 'Connecting...',
            paused: 'Paused', stalled: 'Looks stuck', long_job: 'Still working (long task)', queued: 'Working · {k} more queued',
            capturing: 'Taking a screenshot', working: 'Working', other_target: 'Your agent is working in another file',
            last_failed: 'Last action failed', ready: 'Connected to your agent'
          },
          body: {
            token_mismatch: 'Close and reopen this plugin to pick up the new token. Still failing? Run npx mokido --doctor.',
            token_mismatch_source: 'This is the source copy of the plugin, not the installed one. Run npx mokido --doctor to find the right manifest.',
            offline: 'Start your AI agent (it launches the server), or run npx mokido --doctor.',
            connecting: 'Looking for the Mokido server at {host}',
            paused: "Your agent can read the file but can't change it. Resume to let it work.",
            stalled: 'No progress for {n} s. Your agent will stop and ask you. If Figma is frozen, close and reopen the plugin.',
            long_job: '{desc} · {n} s. Your agent checks back on it - no need to wait here.',
            queued: '{desc}. Figma runs one plugin task at a time.',
            other_target: 'Open files: {files}. Click into this file to make it the target.',
            ready: 'Ask your agent to do something in this file.'
          },
          step: 'Step {n} of {m}',
          retry: 'Retrying in {n} s · attempt {k}',
          traceDone: 'Done: {desc} · {ago}', traceFailed: 'Failed: {desc} · {ago}',
          agoNow: 'just now', agoMin: '{n} min ago', agoH: '{n} h ago',
          versionTitle: "Plugin v{p} and server v{s} don't match",
          versionBody: 'Run npx mokido --update, then reopen the plugin.',
          action: {
            retry: 'Retry now', copyCommand: 'Copy command', copyError: 'Copy error', copyDetails: 'Copy details',
            dismiss: 'Dismiss', pause: 'Pause', resume: 'Resume', undo: 'Undo · {n} left'
          },
          tip: { settings: 'Settings', minimize: 'Minimize', back: 'Back', expand: 'Expand' },
          toastCopied: 'Copied',
          settings: {
            'settings.title': 'Settings', 'settings.connection': 'Connection', 'settings.advanced': 'Advanced', 'settings.server': 'Server address',
            'settings.server.error': 'Use http://host:port', 'settings.test': 'Test connection',
            'settings.ping': 'Ping: {ms} ms', 'settings.pingFail': "Server isn't answering",
            'settings.versionsTitle': 'Versions', 'settings.plugin': 'Plugin', 'settings.serverShort': 'Server',
            'settings.v.same': 'In sync', 'settings.v.diff': 'Versions differ', 'settings.v.off': 'Not connected',
            'settings.copy': 'Copy', 'settings.reopen': 'Then reopen the plugin', 'settings.check': 'Check',
            'settings.appearance': 'Appearance', 'settings.theme': 'Theme', 'settings.theme.auto': 'Auto',
            'settings.theme.light': 'Light', 'settings.theme.dark': 'Dark', 'settings.language': 'Language',
            'settings.defaultView': 'Open as', 'settings.view.full': 'Full', 'settings.view.compact': 'Compact',
            'settings.compact': 'Compact view', 'settings.compact.square': 'Square', 'settings.compact.bar': 'Bar',
            'settings.behavior': 'Behavior', 'settings.autoZoom': 'Zoom to what the agent changes',
            'settings.autoZoom.hint': 'The view jumps to new and edited layers',
            'settings.smartPlacement': 'Place new frames next to existing ones',
            'settings.smartPlacement.hint': 'New frames go to free space, not on top of your work',
            'settings.autoCollapse': 'Collapse while the agent works',
            'settings.autoCollapse.hint': 'The window shrinks to the compact view during a task', 'settings.reset': 'Reset settings'
          }
        },
        ru: {
          notConnected: 'Нет подключения',
          updateNeeded: 'Нужно обновить',
          badge: {
            connecting: 'Подключение', ready: 'Готов', working: 'Работает', capturing: 'Снимок', queued: 'Работает · +{k}',
            long_job: 'Долгая задача · {n} с', stalled: 'Завис · {n} с', paused: 'Пауза', last_failed: 'Ошибка',
            offline: 'Нет связи', token_mismatch: 'Токен не совпал', other_target: 'Другой файл'
          },
          title: {
            token_mismatch: 'Не подключиться: токен не совпадает', offline: 'Сервер Mokido не запущен', connecting: 'Подключаюсь...',
            paused: 'Пауза', stalled: 'Похоже, завис', long_job: 'Всё ещё работаю (долгая задача)', queued: 'Работаю · ещё {k} в очереди',
            capturing: 'Делаю снимок', working: 'Работаю', other_target: 'Агент работает в другом файле',
            last_failed: 'Последнее действие не удалось', ready: 'Агент подключён'
          },
          body: {
            token_mismatch: 'Закройте и снова откройте плагин, чтобы он взял новый токен. Не помогло? Запустите npx mokido --doctor.',
            token_mismatch_source: 'Это исходная копия плагина, а не установленная. Запустите npx mokido --doctor, он покажет нужный manifest.',
            offline: 'Запустите своего ИИ-агента (он поднимает сервер) или выполните npx mokido --doctor.',
            connecting: 'Ищу сервер Mokido на {host}',
            paused: 'Агент может читать файл, но не может его менять. Нажмите Продолжить, чтобы он работал дальше.',
            stalled: 'Нет прогресса {n} с. Агент сам остановится и спросит вас. Если Figma зависла, закройте и снова откройте плагин.',
            long_job: '{desc} · {n} с. Агент сам проверит результат, ждать здесь не нужно.',
            queued: '{desc}. Figma выполняет задачи плагина по одной.',
            other_target: 'Открыты: {files}. Щёлкните в этом файле, чтобы агент работал в нём.',
            ready: 'Попросите агента что-нибудь сделать в этом файле.'
          },
          step: 'Шаг {n} из {m}',
          retry: 'Повтор через {n} с · попытка {k}',
          traceDone: 'Готово: {desc} · {ago}', traceFailed: 'Ошибка: {desc} · {ago}',
          agoNow: 'только что', agoMin: '{n} мин назад', agoH: '{n} ч назад',
          versionTitle: 'Плагин v{p} и сервер v{s} разных версий',
          versionBody: 'Выполните npx mokido --update и откройте плагин заново.',
          action: {
            retry: 'Повторить', copyCommand: 'Копировать команду', copyError: 'Копировать ошибку', copyDetails: 'Копировать детали',
            dismiss: 'Скрыть', pause: 'Пауза', resume: 'Продолжить', undo: 'Отменить · осталось {n}'
          },
          tip: { settings: 'Настройки', minimize: 'Свернуть', back: 'Назад', expand: 'Развернуть' },
          toastCopied: 'Скопировано',
          settings: {
            'settings.title': 'Настройки', 'settings.connection': 'Подключение', 'settings.advanced': 'Дополнительно', 'settings.server': 'Адрес сервера',
            'settings.server.error': 'Формат: http://host:port', 'settings.test': 'Проверить связь',
            'settings.ping': 'Пинг: {ms} мс', 'settings.pingFail': 'Сервер не отвечает',
            'settings.versionsTitle': 'Версии', 'settings.plugin': 'Плагин', 'settings.serverShort': 'Сервер',
            'settings.v.same': 'Совпадают', 'settings.v.diff': 'Разные версии', 'settings.v.off': 'Не подключён',
            'settings.copy': 'Скопировать', 'settings.reopen': 'Затем откройте плагин заново', 'settings.check': 'Проверить',
            'settings.appearance': 'Вид', 'settings.theme': 'Тема', 'settings.theme.auto': 'Авто',
            'settings.theme.light': 'Светлая', 'settings.theme.dark': 'Тёмная', 'settings.language': 'Язык',
            'settings.defaultView': 'Открывать как', 'settings.view.full': 'Полный', 'settings.view.compact': 'Компактный',
            'settings.compact': 'Компактный вид', 'settings.compact.square': 'Квадрат', 'settings.compact.bar': 'Полоса',
            'settings.behavior': 'Поведение', 'settings.autoZoom': 'Приближать то, что меняет агент',
            'settings.autoZoom.hint': 'Экран переходит к новым и изменённым слоям',
            'settings.smartPlacement': 'Ставить новые фреймы рядом с существующими',
            'settings.smartPlacement.hint': 'Новые фреймы встают в свободное место, а не поверх вашей работы',
            'settings.autoCollapse': 'Сворачивать, пока агент работает',
            'settings.autoCollapse.hint': 'На время задачи окно уменьшается до компактного вида', 'settings.reset': 'Сбросить настройки'
          }

      };

      function fill(s, p) {
        return String(s).replace(/\{(\w+)\}/g, function (_, k) { return p && p[k] !== undefined ? p[k] : ''; });
      }
      function texts(lang) { return T[lang] || T.en; }
      function ago(ms, lang) {
        var t = texts(lang), min = Math.floor(ms / 60000);
        if (min < 1) return t.agoNow;
        if (min < 60) return fill(t.agoMin, { n: min });
        return fill(t.agoH, { n: Math.floor(min / 60) });
      }
      function stepLine(a, lang) {
        if (!a) return '';
        if (a.step) {
          var s = a.of ? fill(texts(lang).step, { n: a.step, m: a.of }) : '#' + a.step;
          return a.note ? s + ' · ' + a.note : s;
        }
        return a.note || '';
      }

      // Everything the screen shows for one model at one moment. `opts`: lang,
      // hasToken, pluginVersion, serverUrl, pillOpen, versionDismissed, undoLeft.
      function viewModel(m, now, opts) {
        opts = opts || {};
        var lang = opts.lang === 'ru' ? 'ru' : 'en', t = texts(lang);
        var state = deriveState(m, now);
        var list = activeList(m), oldest = list[0];
        var lim = limitsOf(m);
        var desc = oldest ? oldest.desc : '';
        var vm = {
          state: state, mood: MOOD[state], dim: state === 'offline', zzz: state === 'offline',
          errorDot: MOOD[state] === 'sad',
          context: m.ws === 'open' && m.doc && m.doc.fileName
            ? (m.doc.pageName ? m.doc.pageName + ' · ' : '') + m.doc.fileName : (m.ws === 'open' ? '' : t.notConnected),
          title: t.title[state], body: '', bodyLines: 3, extra: '', code: '', progress: null,
          buttons: [], footer: '', footerNodeId: null, badge: '', pill: null, resume: state === 'paused'
        };
        var n;
        switch (state) {
          case 'token_mismatch':
            vm.body = opts.hasToken ? t.body.token_mismatch : t.body.token_mismatch_source;
            vm.buttons = [{ action: 'copyDoctor', label: t.action.copyCommand, icon: 'copy', variant: 'secondary' }];
            break;
          case 'offline':
            vm.body = t.body.offline;
            vm.buttons = [
              { action: 'retry', label: t.action.retry, icon: 'refresh', variant: 'primary' },
              { action: 'copyDoctor', label: t.action.copyCommand, icon: 'copy', variant: 'ghost' }
            ];
            vm.footer = fill(t.retry, { n: Math.max(0, Math.ceil(((m.retryAt || now) - now) / 1000)), k: (m.attempts || 0) + 1 });
            break;
          case 'connecting':
            vm.body = fill(t.body.connecting, { host: hostPort(opts.serverUrl) || '127.0.0.1:8765' });
            break;
          case 'paused':
            vm.body = t.body.paused;
            vm.buttons = [{ action: 'resume', label: t.action.resume, icon: 'play', variant: 'primary' }];
            break;
          case 'stalled':
            n = Math.round(Math.max.apply(null, list.map(function (a) { return quietMs(a, now); })) / 1000);
            vm.body = fill(t.body.stalled, { n: n });
            vm.badge = fill(t.badge.stalled, { n: n });
            vm.buttons = [{ action: 'copyDetails', label: t.action.copyDetails, icon: 'copy', variant: 'secondary' }];
            break;
          case 'long_job':
            n = Math.round((now - oldest.startedAt) / 1000);
            vm.body = fill(t.body.long_job, { desc: desc, n: n });
            vm.badge = fill(t.badge.long_job, { n: n });
            break;
          case 'queued':
            vm.title = fill(t.title.queued, { k: list.length - 1 });
            vm.badge = fill(t.badge.queued, { k: list.length - 1 });
            vm.body = fill(t.body.queued, { desc: desc });
            break;
          case 'capturing':
          case 'working':
            vm.body = desc;
            break;
          case 'other_target':
            var mine = myTarget(m);
            var files = ((m.status && m.status.targets) || [])
              .filter(function (x) { return !mine || x.id !== mine.id; })
              .map(function (x) { return x.fileName || '?'; });
            vm.body = fill(t.body.other_target, { files: files.join(', ') });
            break;
          case 'last_failed':
            var r = m.lastResult;
            vm.body = (r.description ? r.description + ': ' : '') + (r.error || '');
            vm.code = r.code || '';
            vm.buttons = [
              { action: 'copyError', label: t.action.copyError, icon: 'copy', variant: 'secondary' },
              { action: 'dismiss', label: t.action.dismiss, icon: 'x', variant: 'ghost' }
            ];
            break;
          default:
            vm.body = t.body.ready;
        }
        if (state === 'working' || state === 'queued' || state === 'long_job' || state === 'capturing') {
          vm.bodyLines = 2;
          if (state !== 'capturing') {
            vm.extra = stepLine(oldest, lang);
            vm.progress = oldest.of ? { value: Math.min(1, oldest.step / oldest.of) } : { indeterminate: true };
            vm.buttons = [{ action: 'pause', label: t.action.pause, icon: 'pause', variant: 'secondary' }];
            if (opts.undoLeft > 0) vm.buttons.push({ action: 'undo', label: fill(t.action.undo, { n: opts.undoLeft }), icon: 'undo', variant: 'ghost' });
          }
        }
        if (!vm.badge) vm.badge = t.badge[state];

        // Trace line: last finished action, only while connected (offline uses the footer for retries).
        if (state !== 'offline' && m.ws === 'open' && m.lastDone) {
          vm.footer = fill(m.lastDone.ok ? t.traceDone : t.traceFailed, { desc: m.lastDone.desc, ago: ago(now - m.lastDone.at, lang) });
          vm.footerNodeId = m.lastDone.nodeId || null;
        }

        // version_mismatch: a pill in the header; open, it takes over the bubble (SPEC 8 E6).
        var serverVersion = m.status && m.status.serverVersion;
        if (m.ws === 'open' && versionMismatch(opts.pluginVersion, serverVersion) && !opts.versionDismissed) {
          vm.pill = { label: t.updateNeeded, open: !!opts.pillOpen };
          if (opts.pillOpen) {
            vm.title = fill(t.versionTitle, { p: opts.pluginVersion, s: serverVersion });
            vm.body = t.versionBody; vm.bodyLines = 3; vm.extra = ''; vm.code = ''; vm.progress = null;
            vm.buttons = [
              { action: 'copyUpdate', label: t.action.copyCommand, icon: 'copy', variant: 'secondary' },
              { action: 'dismissVersion', label: t.action.dismiss, icon: 'x', variant: 'ghost' }
            ];
          }
        }
        return vm;

        const [w, h] = settings.windowSize || SETTINGS_DEFAULTS.windowSize;
        // Settings grow the window to at least 360x560 (unreadable at 240 high); closing restores windowSize.
        if (ui.settingsOpen) return [clamp(Math.max(w, SETTINGS_SIZE[0]), FULL_MIN[0], FULL_MAX[0]), clamp(Math.max(h, SETTINGS_SIZE[1]), FULL_MIN[1], FULL_MAX[1])];
        return [clamp(w, FULL_MIN[0], FULL_MAX[0]), clamp(h, FULL_MIN[1], FULL_MAX[1])];
      }
      if (settings.compactStyle === 'bar') return BAR_SIZE;
      // "Square" is a name, not a shape: width and height resize independently. An old saved number n means n wide.
      const sq = settings.squareSize;
      const [w, h] = Array.isArray(sq) ? sq : typeof sq === 'number' ? [sq, Math.round(sq * 0.75)] : SETTINGS_DEFAULTS.squareSize;
      return [clamp(w, SQUARE_MIN[0], SQUARE_MAX[0]), clamp(h, SQUARE_MIN[1], SQUARE_MAX[1])];
    }
    function applyWindowSize() {
      const [width, height] = windowSizeFor(ui.view);
      toPlugin({ type: 'RESIZE_WINDOW', width, height });
    }
    function setView(view, manual) {
      if (manual && view === 'compact') ui.collapsedIn = ui.prevState;
      ui.view = view;
      if (view === 'compact') ui.settingsOpen = false;
      applyWindowSize();
      render();
    }

    (function wireGrip() {
      const grip = $('grip');
      let start = null, raf = 0, size = null;
      grip.addEventListener('pointerdown', (e) => {
        start = { x: e.screenX, y: e.screenY, w: window.innerWidth, h: window.innerHeight };
        grip.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      grip.addEventListener('pointermove', (e) => {
        if (!start) return;
        const dx = e.screenX - start.x, dy = e.screenY - start.y;
        if (ui.view === 'full') {
          size = [clamp(start.w + dx, FULL_MIN[0], FULL_MAX[0]), clamp(start.h + dy, FULL_MIN[1], FULL_MAX[1])];
        } else {
          size = [clamp(start.w + dx, SQUARE_MIN[0], SQUARE_MAX[0]), clamp(start.h + dy, SQUARE_MIN[1], SQUARE_MAX[1])];
        }
        if (!raf) raf = requestAnimationFrame(() => {
          raf = 0;
          toPlugin({ type: 'RESIZE_WINDOW', width: size[0], height: size[1] });
        });
      });
      const end = () => {
        if (!start) return;
        start = null;
        if (!size) return;
        if (ui.settingsOpen) { size = null; return; } // a drag in Settings must not overwrite the main window size
        if (ui.view === 'full') settings.windowSize = size; else settings.squareSize = size;
        size = null;
        saveSettings();
      };
      grip.addEventListener('pointerup', end);
      grip.addEventListener('pointercancel', end);
    })();
    window.addEventListener('resize', () => render());

    // ==========================================
    // Actions
    // ==========================================
    let toastTimer = null;
    function toast(text) {
      const el = $('toast');
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 1500);
    }
    async function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
      }
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed'; ta.style.left = '-9999px'; ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (e) { return false; }
    }
    async function copy(text) {
      if (await copyToClipboard(text)) toast(MK.texts(settings.language).toastCopied);
    }

    function setPaused(val) {
      model.paused = val;
      toPlugin({ type: 'SET_PAUSED', value: val });
      render();
    }

    // Undo — routed straight to code.js as a local UI action ("ui_" id prefix),
    // not through the server: this is the user acting, not the agent, so the
    // result is handled here rather than reported back as if a tool call happened.
    function listCheckpoints() {
      toPlugin({ type: 'LIST_CHECKPOINTS', id: 'ui_list_' + Date.now() });
    }
    function undo() {
      toPlugin({ type: 'ROLLBACK', id: 'ui_undo_' + Date.now(), checkpoint_id: 'last', startTime: performance.now() });
    }

    function stalledDetails() {
      const now = Date.now();
      return Array.from(model.active.entries()).map(([id, a]) =>
        `${a.desc} (#${id}, ${a.kind}): running ${Math.round((now - a.startedAt) / 1000)} s, ` +
        `last progress ${a.lastProgressAt ? Math.round((now - a.lastProgressAt) / 1000) + ' s ago' : 'never'}` +
        (a.step ? `, step ${a.step}${a.of ? ' of ' + a.of : ''}${a.note ? ' · ' + a.note : ''}` : '')).join('\n');
    }

    const ACTIONS = {
      retry: () => { model.attempts = Math.min(model.attempts, 3); connectWebSocket(true); },
      copyDoctor: () => copy('npx mokido --doctor'),
      copyUpdate: () => copy('npx mokido --update'),
      copyError: () => {
        const r = model.lastResult || {};
        copy(`${r.description || 'Command'}: ${r.error || ''}${r.code ? '\n' + r.code : ''}`);
      },
      copyDetails: () => copy(stalledDetails()),
      dismiss: () => { model.failDismissed = true; render(); },
      dismissVersion: () => { ui.versionDismissed = true; ui.pillOpen = false; render(); },
      pause: () => setPaused(true),
      resume: () => setPaused(false),
      undo: () => undo()
    };
    $('buttons').addEventListener('click', (e) => {
      const b = e.target.closest('[data-action]');
      if (b && ACTIONS[b.dataset.action]) ACTIONS[b.dataset.action]();
    });
    $('pill').onclick = () => { ui.pillOpen = !ui.pillOpen; render(); };
    $('btn-settings').onclick = () => {
      ui.settingsOpen = true;
      if (model.ws !== 'open') $('set-advanced').open = true;
      applyWindowSize(); render();
    };
    $('btn-back').onclick = () => { ui.settingsOpen = false; applyWindowSize(); render(); };
    $('btn-minimize').onclick = () => setView('compact', true);
    $('square-expand').onclick = () => setView('full');
    $('bar-expand').onclick = () => setView('full');
    $('square-resume').onclick = () => setPaused(false);
    $('bar-resume').onclick = () => setPaused(false);
    $('trace').onclick = () => {
      if (model.lastDone && model.lastDone.nodeId) toPlugin({ type: 'JUMP_TO_NODE', nodeId: model.lastDone.nodeId });
    };

    // ==========================================
    // Settings
    // ==========================================
    function saveSettings() {
      toPlugin({ type: 'SAVE_SETTINGS', settings: { ...settings } });
    }

    function applyTheme() {
      const root = document.documentElement;
      if (settings.theme === 'light' || settings.theme === 'dark') root.dataset.theme = settings.theme;
      else delete root.dataset.theme;
      root.lang = settings.language === 'ru' ? 'ru' : 'en';
    }

    // Only known fields survive: old compactPreset / captureScale / logLimit are dropped (SPEC 4).
    function applySettings(s) {
      const d = SETTINGS_DEFAULTS;
      const pick = (k, ok) => (ok(s[k]) ? s[k] : d[k]);
      const isBool = (v) => typeof v === 'boolean';
      settings = {
        defaultView: pick('defaultView', v => v === 'full' || v === 'compact'),
        autoZoom: pick('autoZoom', isBool),
        smartPlacement: pick('smartPlacement', isBool),
        autoCollapse: pick('autoCollapse', isBool),
        serverUrl: pick('serverUrl', MK.validServerUrl).trim().replace(/\/$/, ''),
        theme: pick('theme', v => ['auto', 'light', 'dark'].includes(v)),
        language: pick('language', v => v === 'en' || v === 'ru'),
        compactStyle: pick('compactStyle', v => v === 'square' || v === 'bar'),
        windowSize: pick('windowSize', v => Array.isArray(v) && v.length === 2 && v.every(n => typeof n === 'number')),
        squareSize: pick('squareSize', v => typeof v === 'number' || (Array.isArray(v) && v.length === 2 && v.every(n => typeof n === 'number')))
      };
      applyTheme();
    }

    function setServerUrl(url) {
      if (url === SERVER_URL) return;
      SERVER_URL = url;
      settings.serverUrl = url;
      // U-03: reconnect at once with a fresh attempt counter.
      model.attempts = 0;
      model.httpStatus = null;
      model.status = null;
      model.myClientId = null;
      dropSocket();
      connectWebSocket(true);
    }

    function renderSettings() {
      const t = MK.texts(settings.language);
      document.querySelectorAll('#view-settings [data-t]').forEach(el => {
        const label = el.querySelector('.Label') || el;
        label.textContent = t.settings[el.dataset.t] || '';
      });
      const input = $('set-server');
      if (document.activeElement !== input && !input.classList.contains('error')) input.value = SERVER_URL;
      const sv = model.ws === 'open' && model.status && model.status.serverVersion;
      const mismatch = MK.versionMismatch(PLUGIN_VERSION, sv);
      $('ver-plugin').textContent = PLUGIN_VERSION;
      $('ver-server').textContent = sv || '-';
      $('ver-server').className = 'VerNum' + (mismatch ? ' warn' : sv ? '' : ' none');
      $('ver-card').classList.toggle('mismatch', mismatch);
      $('ver-chip').className = 'Chip' + (mismatch ? ' warn' : sv ? ' ok' : '');
      $('ver-chip').textContent = t.settings[mismatch ? 'settings.v.diff' : sv ? 'settings.v.same' : 'settings.v.off'];
      $('ver-fix').hidden = !mismatch;
      $('ver-off').hidden = !!sv;
      const pingText = ui.pingFail ? t.settings['settings.pingFail']
        : ui.pingMs !== null ? MK.fill(t.settings['settings.ping'], { ms: ui.pingMs }) : '';
      $('set-ping').textContent = pingText;
      $('set-ping').hidden = !pingText;
      $('set-ping').classList.toggle('err', !!ui.pingFail);
      document.querySelectorAll('#view-settings .Segmented, #view-settings .Cards').forEach(seg => {
        for (const b of seg.children) b.setAttribute('aria-pressed', String(settings[seg.dataset.setting] === b.dataset.value));
      });
      document.querySelectorAll('#view-settings .Toggle').forEach(tg => tg.setAttribute('aria-checked', String(!!settings[tg.dataset.setting])));
      $('btn-back').title = t.tip.back;
    }

    $('set-server').addEventListener('change', (e) => {
      const v = e.target.value.trim();
      const ok = MK.validServerUrl(v);
      e.target.classList.toggle('error', !ok);
      $('set-server-error').hidden = ok;
      if (!ok) return;
      setServerUrl(v.replace(/\/$/, ''));
      saveSettings();
      render();
    });
    $('set-server').addEventListener('input', (e) => {
      if (MK.validServerUrl(e.target.value)) { e.target.classList.remove('error'); $('set-server-error').hidden = true; }
    });
    document.querySelectorAll('#view-settings .Segmented, #view-settings .Cards').forEach(seg => seg.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      settings[seg.dataset.setting] = b.dataset.value;
      applyTheme();
      saveSettings();
      render();
    }));
    document.querySelectorAll('#view-settings .Toggle').forEach(tg => tg.addEventListener('click', () => {
      const key = tg.dataset.setting;
      settings[key] = !settings[key];
      if (key === 'autoZoom') toPlugin({ type: 'SET_AUTO_ZOOM', value: settings.autoZoom });
      if (key === 'smartPlacement') toPlugin({ type: 'SET_SMART_PLACEMENT', value: settings.smartPlacement });
      saveSettings();
      render();
    }));
    $('set-reset').onclick = () => {
      const keepSize = settings.windowSize;
      applySettings({ ...SETTINGS_DEFAULTS, windowSize: keepSize });
      setServerUrl(settings.serverUrl);
      toPlugin({ type: 'SET_AUTO_ZOOM', value: settings.autoZoom });
      toPlugin({ type: 'SET_SMART_PLACEMENT', value: settings.smartPlacement });
      saveSettings();
      render();
    };
    // U-14: real round trip PING -> PONG.
    let pingT0 = 0;
    $('ver-copy').onclick = () => ACTIONS.copyUpdate();
    $('ver-test').onclick = () => { $('set-advanced').open = true; $('set-test').click(); };
    $('set-test').onclick = async () => {
      ui.pingFail = false;
      if (ws && ws.readyState === WebSocket.OPEN) {
        pingT0 = performance.now();
        ws.send(JSON.stringify({ type: 'PING', timestamp: Date.now() }));
        pollStatus();
      } else {
        const t0 = performance.now();
        const code = await probeStatus();
        if (code === 'ok') { ui.pingMs = Math.round(performance.now() - t0); connectWebSocket(true); }
        else { ui.pingMs = null; ui.pingFail = true; }
      }
      render();
    };

    // ==========================================
    // Server: /status and the WebSocket (RFC 6455)
    // ==========================================
    // Appends the bridge token as a query param — the server accepts it there
    // for the WS handshake and for browser fetches that cannot set a custom
    // header without a CORS preflight.
    function withToken(url) {
      if (!BRIDGE_TOKEN) return url;
      const sep = url.includes('?') ? '&' : '?';
      return `${url}${sep}token=${encodeURIComponent(BRIDGE_TOKEN)}`;
    }
    function tokenHeaders(extra) {
      return BRIDGE_TOKEN ? { ...extra, 'X-Bridge-Token': BRIDGE_TOKEN } : { ...extra };
    }

    // A bad/stale BRIDGE_TOKEN makes the server reject the WS handshake before
    // it upgrades, which the browser reports only as a generic close. A plain
    // fetch to /status does expose the HTTP status: 403 = token, no answer =
    // server not running.
    async function probeStatus() {
      try {
        const res = await fetch(withToken(`${SERVER_URL}/status`));
        model.httpStatus = res.status === 403 ? '403' : res.ok ? 'ok' : 'fail';
        if (res.ok) applyStatus(await res.json());
      } catch (e) {
        model.httpStatus = 'fail';
      }
      return model.httpStatus;
    }

    let statusBusy = false;
    async function pollStatus() {
      if (statusBusy) return;
      statusBusy = true;
      try {
        const res = await fetch(withToken(`${SERVER_URL}/status`));
        if (res.ok) applyStatus(await res.json());
      } catch (e) {}
      statusBusy = false;
      render();
    }
    function applyStatus(data) {
      model.status = data || null;
      const wasMismatch = ui.lastMismatch;
      ui.lastMismatch = MK.versionMismatch(PLUGIN_VERSION, data && data.serverVersion);
      // version_mismatch expands the compact view once per session (SPEC 3).
      if (ui.lastMismatch && !wasMismatch && ui.view === 'compact' && !ui.expandedOnce.version) {
        ui.expandedOnce.version = true;
        setView('full');
      }
    }

    let ws = null;
    let reconnectTimer = null;
    let heartbeat = null;

    function wsUrl() { return SERVER_URL.replace(/^http/, 'ws'); }

    function sendDocIdentity(type) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      // Document identity (Target Router) and this plugin's version (version pill).
      ws.send(JSON.stringify({
        type, timestamp: Date.now(),
        fileKey: model.doc.fileKey, fileName: model.doc.fileName, pageName: model.doc.pageName,
        pluginVersion: PLUGIN_VERSION
      }));
    }

    function dropSocket() {
      clearTimeout(reconnectTimer);
      clearInterval(heartbeat);
      if (ws) {
        const old = ws;
        ws = null;
        old.onopen = old.onmessage = old.onclose = old.onerror = null;
        try { old.close(); } catch (e) {}
      }
    }

    function connectWebSocket(now) {
      if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;
      clearTimeout(reconnectTimer);
      model.retryAt = 0;
      if (now) render();
      let sock;
      try {
        sock = ws = new WebSocket(withToken(wsUrl()));
      } catch (err) {
        onSocketClosed(null);
        return;
      }
      sock.onopen = () => {
        if (sock !== ws) return;
        model.ws = 'open';
        model.attempts = 0;
        model.httpStatus = null;
        sendDocIdentity('CLIENT_READY');
        pollStatus();
        listCheckpoints();
        clearInterval(heartbeat);
        heartbeat = setInterval(() => {
          if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'PING' }));
        }, 10000);
        render();
      };
      sock.onmessage = (event) => { if (sock === ws) onServerMessage(event); };
      sock.onclose = () => { if (sock === ws) onSocketClosed(sock); };
    }

    function onSocketClosed() {
      clearInterval(heartbeat);
      ws = null;
      model.ws = 'closed';
      model.myClientId = null;
      model.attempts++;
      if (model.attempts >= 3) probeStatus().then(render);
      const delay = MK.backoff(model.attempts);
      model.retryAt = Date.now() + delay;
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(() => connectWebSocket(), delay);
      render();
    }

    function onServerMessage(event) {
      let data;
      try { data = JSON.parse(event.data); } catch (err) { return; }
      if (!data) return;
      if (data.type === 'PONG') {
        if (pingT0) { ui.pingMs = Math.round(performance.now() - pingT0); pingT0 = 0; render(); }
        return;
      }
      if (data.type === 'CLIENT_ACK') {
        model.myClientId = data.clientId || null;
        render();
        return;
      }
      if (!data.id) return;

      const isCapture = data.capture === true || data.type === 'SCREENSHOT';
      const msgType = data.type || (data.code ? 'EXECUTE' : 'UNKNOWN');
      model.active.set(data.id, {
        desc: data.description || msgType, kind: msgType, isCapture,
        startedAt: Date.now(), lastProgressAt: 0, step: 0, of: 0, note: ''
      });
      render();
      toPlugin({ ...data, type: msgType, autoZoom: settings.autoZoom, startTime: performance.now() });
    }

    // Wake up immediately and report focus on visibility change (Target Router).
    function onFocus() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'CLIENT_FOCUS', timestamp: Date.now() }));
        pollStatus();
      } else {
        connectWebSocket(true);
      }
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) onFocus(); });
    window.addEventListener('focus', onFocus);

    // /status every 3 s while the panel is visible: targets, server version, limits.
    setInterval(() => {
      if (!document.hidden && model.ws === 'open') pollStatus();
    }, 3000);
    // Clock for durations, retry countdown and "N min ago".
    setInterval(() => render(), 1000);

    // ==========================================
    // Messages from the Figma sandbox (code.js)
    // ==========================================
    async function returnResult(msg) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(msg));
        return;
      }
      try {
        await fetch(withToken(`${SERVER_URL}/result`), {
          method: 'POST',
          headers: tokenHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify(msg)
        });
      } catch (e) {}
    }

    function handleLocalResult(msg) {
      const id = String(msg.id);
      if (id.startsWith('ui_list_')) {
        const list = msg.success && Array.isArray(msg.result) ? msg.result : [];
        ui.undoLeft = list.filter(c => c.committed && !c.rolledBack).length;
      } else if (id.startsWith('ui_undo_')) {
        if (!msg.success) {
          model.lastResult = { success: false, description: 'Undo', error: msg.error, code: msg.code || '' };
          model.failDismissed = false;
        }
        listCheckpoints();
      }
      render();
    }

    window.onmessage = async (event) => {
      const msg = event.data && event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'SETTINGS_LOADED') {
        applySettings({ ...SETTINGS_DEFAULTS, ...(msg.settings || {}) });
        setServerUrl(settings.serverUrl);
        // U-04: the sandbox starts with its own defaults; send the stored values.
        toPlugin({ type: 'SET_AUTO_ZOOM', value: settings.autoZoom });
        toPlugin({ type: 'SET_SMART_PLACEMENT', value: settings.smartPlacement });
        setView(settings.defaultView === 'compact' ? 'compact' : 'full');
        return;
      }

      if (msg.type === 'DOC_INFO' || msg.type === 'PAGE_CHANGED') {
        if (msg.fileKey !== undefined) model.doc.fileKey = msg.fileKey;
        if (msg.fileName !== undefined) model.doc.fileName = msg.fileName;
        if (msg.pageName !== undefined) model.doc.pageName = msg.pageName;
        sendDocIdentity('CLIENT_FOCUS');
        render();
        return;
      }

      if (msg.type === 'PROGRESS') {
        const a = model.active.get(msg.id);
        if (a) Object.assign(a, { step: msg.step, of: msg.of || 0, note: msg.note || '', lastProgressAt: Date.now() });
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'PROGRESS', id: msg.id, step: msg.step, of: msg.of, note: msg.note, ts: msg.ts }));
        }
        render();
        return;
      }

      // U-08: a script's log() shows as the note of the running task.
      if (msg.type === 'LOG') {
        const oldest = Array.from(model.active.values()).sort((x, y) => x.startedAt - y.startedAt)[0];
        if (oldest) { oldest.note = String(msg.text || '').split('\n')[0].slice(0, 200); oldest.lastProgressAt = Date.now(); }
        render();
        return;
      }

      if (msg.type === 'PAUSED_STATE') {
        model.paused = msg.paused === true;
        render();
        return;
      }

      if (msg.type === 'RESULT') {
        if (String(msg.id || '').startsWith('ui_')) { handleLocalResult(msg); return; }
        model.active.delete(msg.id);
        const desc = msg.description || 'Command';
        if (msg.code === 'EXECUTION_PAUSED' && model.paused) {
          // Blocked while paused: the agent is told; not a failure card.
        } else if (msg.success) {
          model.failDismissed = true;
          model.lastDone = { desc, ok: true, at: Date.now(), nodeId: msg.targetId || null };
          if (msg.checkpointId) listCheckpoints();
        } else {
          model.lastResult = { success: false, description: desc, error: msg.error || '', code: msg.code || '', id: msg.id };
          model.failDismissed = false;
          model.lastDone = { desc, ok: false, at: Date.now(), nodeId: null };
        }
        if (msg.success) model.lastResult = { success: true, description: desc, id: msg.id };
        render();
        await returnResult(msg);
      }
    };

    // Exposed for the preview stand (planning/ui-redesign/preview.html); harmless in Figma.
    window.MokidoUI = { model, ui, render, applySettings: (s) => { applySettings({ ...SETTINGS_DEFAULTS, ...s }); render(); }, setView };

    // Ask code.js for the document identity and stored settings, then connect.
    applyTheme();
    render();
    toPlugin({ type: 'GET_DOC_INFO' });
    toPlugin({ type: 'LOAD_SETTINGS' });
    connectWebSocket();
  </script>
</body>
</html>
